name: Community triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >-
            Thanks for opening your first issue! A maintainer will triage it soon.
            Please make sure all logs and screenshots are free of personal data.
            첫 issue를 남겨주셔서 감사합니다. 로그와 스크린샷에서 개인정보를 제거했는지 확인해 주세요.
          pr-message: >-
            Thanks for your first contribution! Please ensure the checklist is complete
            and CI passes. 첫 기여 감사합니다. PR 체크리스트와 CI 결과를 확인해 주세요.
